name: Pipeline MLOps/GitOps

# GitOps: git es la unica fuente de verdad. Cualquier cambio a codigo, datos
# de entrenamiento o al artefacto del modelo pasa por este pipeline antes de
# considerarse valido; el despliegue a produccion (Render) ya esta
# conectado a push sobre `main` de forma independiente (ver
# docs/manual_despliegue.md) -- este pipeline es lo que decide si ese push
# deberia haber llegado a `main` en primer lugar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # --- Integracion continua: pruebas automatizadas de codigo y datos ---
      - name: Pruebas de codigo y datos (pytest)
        run: pytest tests/ -v

      # --- MLOps: reentrenamiento reproducible + validacion del umbral minimo ---
      - name: Reentrenar y validar F1 minimo (0.80)
        id: entrenar
        run: |
          python -m src.generate_data
          SALIDA=$(python -m src.train)
          echo "$SALIDA"
          F1=$(echo "$SALIDA" | grep "F1 prueba:" | awk '{print $3}')
          echo "f1=$F1" >> "$GITHUB_OUTPUT"
          python -c "
          import sys
          f1 = float('$F1')
          umbral = 0.80
          print(f'F1 obtenido: {f1:.4f} (minimo requerido: {umbral})')
          sys.exit(0 if f1 >= umbral else 1)
          "

      # --- Gobernanza: gate de fairness (prueba de regresion, Actividad 9) ---
      - name: Gate de fairness (sin regresion vs. linea base)
        run: python -m fase3.scripts.gate_fairness

      # --- Versionado de artefactos: registro ligero basado en git ---
      - name: Registrar version del modelo (evidencia del run)
        run: python -m fase3.scripts.registrar_version_modelo --f1 "${{ steps.entrenar.outputs.f1 }}"

      # --- Validacion de contenerizacion antes de permitir el despliegue ---
      - name: Construir imagen Docker
        run: docker build -t abandono-escolar-api .

      - name: Publicar artefactos del run (modelo, registro, dataset)
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-pipeline-${{ github.run_number }}
          path: |
            models/modelo_abandono.joblib
            data/dataset_abandono.csv
            fase3/evidencia/model_registry.json
          retention-days: 30

  smoke-test-produccion:
    name: Verificar despliegue en produccion (solo push a main)
    needs: pipeline
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Esperar el redeploy de Render
        run: sleep 90

      - name: Monitoreo post-deploy (canary checks reales)
        run: python -m actividad8.scripts.monitor --ciclos 3 --intervalo-seg 5 --run-name "pipeline_ci_run_${{ github.run_number }}"
